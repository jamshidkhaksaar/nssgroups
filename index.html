<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171231" />
    <title>NSS Global Logistics &amp; Sourcing</title>
    <meta
      name="description"
      content="NSS coordinates global sourcing, freight transport and construction services across Central Asia and international corridors."
    />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="canonical" href="https://nssgroupint.com/" />

    <!-- Static social-share defaults (no-JS fallback for crawlers that don't run React).
         Per-route values are injected at build time by scripts/inject-route-meta.mjs. -->
    <meta property="og:site_name" content="NSS International Group of Companies" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NSS International Group of Companies — Transport · Logistics · Construction" />
    <meta
      property="og:description"
      content="NSS International Group of Companies — rail freight, road transport, logistics and construction across Central Asia and Europe. Your Cargo, Our Responsibility."
    />
    <meta property="og:url" content="https://nssgroupint.com/" />
    <meta property="og:image" content="https://nssgroupint.com/hero/nss-marketplace-hero.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NSS International Group of Companies — Transport · Logistics · Construction" />
    <meta
      name="twitter:description"
      content="NSS International Group of Companies — rail freight, road transport, logistics and construction across Central Asia and Europe. Your Cargo, Our Responsibility."
    />
    <meta name="twitter:image" content="https://nssgroupint.com/hero/nss-marketplace-hero.webp" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "NSS International Group of Companies",
        "url": "https://nssgroupint.com/",
        "logo": "https://nssgroupint.com/logo.png",
        "description": "Rail freight, road transport, logistics and construction across Central Asia and Europe.",
        "email": "info@nssgroupint.com",
        "contactPoint": {
          "@type": "ContactPoint",
          "email": "info@nssgroupint.com",
          "telephone": "+93 78 452 6666",
          "contactType": "customer service"
        },
        "sameAs": [
          "https://www.facebook.com/nssgroup01",
          "https://www.instagram.com/samimsamirgroup/"
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Vazirmatn:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Noto+Sans+Arabic:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html { background: #171231; }
      html[data-theme='light'] { background: #f4efe4; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
