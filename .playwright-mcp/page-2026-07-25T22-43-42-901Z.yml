        - article [ref=f5e507]:
          - heading "Procurement and transport workflows" [level=3] [ref=f5e514]
          - paragraph [ref=f5e515]: Structured requests for sourcing, road, rail, air, sea, customs, and warehousing with quote revisions and staff confirmation.
        - article [ref=f5e517]:
          - heading "Shipment and document visibility" [level=3] [ref=f5e524]
          - paragraph [ref=f5e525]: Safe milestone tracking, modal-leg identifiers, source timestamps, and authorized access to versioned private documents.
        - article [ref=f5e527]:
          - heading "Organization portals and governance" [level=3] [ref=f5e533]
          - paragraph [ref=f5e534]: Separate customer, supplier, operations, finance, content, and administration workspaces with membership, KYC, and audit controls.
      - paragraph [ref=f5e539]: Platform functions will be released through staged acceptance. Tracking detail, provider coverage, rates, inventory, and capacity depend on verified data and integrations.
