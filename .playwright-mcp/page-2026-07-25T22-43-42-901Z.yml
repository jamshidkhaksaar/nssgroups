    - generic [ref=f5e306]:
      - generic [ref=f5e307]:
        - paragraph [ref=f5e308]: HOW NSS WORKS
        - heading "An RFQ-led process with confirmation before commitment." [level=2] [ref=f5e309]
        - paragraph [ref=f5e310]: Submitting a request starts review; it does not reserve capacity, create an order, or guarantee a rate.
      - generic [ref=f5e311]:
        - article [ref=f5e313]:
          - generic [ref=f5e314]: "01"
          - heading "1. Requirement review" [level=3] [ref=f5e322]
          - paragraph [ref=f5e323]: NSS records the product, cargo, origin, destination, timing, specifications, and documents needed to understand the request.
        - article [ref=f5e325]:
          - generic [ref=f5e326]: "02"
          - heading "2. Clarification and compliance" [level=3] [ref=f5e332]
          - paragraph [ref=f5e333]: Staff identify missing information, regulated-goods requirements, destination restrictions, and required human approvals.
        - article [ref=f5e335]:
          - generic [ref=f5e336]: "03"
          - heading "3. Sourcing and planning" [level=3] [ref=f5e343]
          - paragraph [ref=f5e344]: Qualified suppliers, routes, modes, equipment, handlers, and operational assumptions are compared for the case.
        - article [ref=f5e346]:
          - generic [ref=f5e347]: "04"
          - heading "4. Versioned quotation" [level=3] [ref=f5e352]
          - paragraph [ref=f5e353]: NSS issues a time-limited quote showing scope, currency, Incoterms where relevant, assumptions, exclusions, and revisions.
        - article [ref=f5e355]:
          - generic [ref=f5e356]: "05"
          - heading "5. Capacity confirmation" [level=3] [ref=f5e365]
          - paragraph [ref=f5e366]: Only authorized staff confirm supplier, carrier, schedule, equipment, and capacity after quote acceptance and required approvals.
        - article [ref=f5e368]:
          - generic [ref=f5e369]: "06"
          - heading "6. Order and delivery record" [level=3] [ref=f5e375]
          - paragraph [ref=f5e376]: A confirmed case becomes an order and, when applicable, one or more shipment legs with events, documents, and delivery evidence.
      - paragraph [ref=f5e382]: NSS does not present inquiry forms as binding orders. There is no public online checkout, escrow, autonomous customs clearance, or guaranteed real-time tracking.
