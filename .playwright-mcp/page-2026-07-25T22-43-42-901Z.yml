        - paragraph [ref=f5e491]: WHAT NSS IS BUILDING
        - heading "A governed digital layer for regional B2B coordination." [level=2] [ref=f5e492]
        - paragraph [ref=f5e493]: The roadmap converts manual relationships and records into structured workflows. It describes development direction, not an active service guarantee.
