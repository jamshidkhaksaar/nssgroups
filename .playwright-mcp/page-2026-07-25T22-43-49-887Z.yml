            - heading "Freight-union heritage" [level=3] [ref=f6e61]
          - paragraph [ref=f6e62]: Tamim Sahib Ansar Freight Union organized freight and driver coordination inside Afghanistan, establishing the service roots later carried into the NSS group.
        - listitem [ref=f6e64]:
          - generic [ref=f6e66]:
            - paragraph [ref=f6e67]: "2010"
            - heading "Formal freight-forwarding company" [level=3] [ref=f6e68]
          - paragraph [ref=f6e69]: Nawi Samim Samir International Transit and Freight Forwarding Limited was formally established, creating a registered base for domestic and international logistics work.
        - listitem [ref=f6e71]:
          - generic [ref=f6e73]:
            - paragraph [ref=f6e74]: "2013"
            - heading "Construction capability added" [level=3] [ref=f6e75]
          - paragraph [ref=f6e76]: Jabbar Peyman Construction and Road Building Company expanded the group record into construction, roadwork, equipment, and supporting logistics.
        - listitem [ref=f6e78]:
          - generic [ref=f6e80]:
            - paragraph [ref=f6e81]: "2015"
            - heading "Specialist logistics expansion" [level=3] [ref=f6e82]
          - paragraph [ref=f6e83]: Roshangaran Haqiq Logistics Services joined the documented structure, strengthening specialist logistics and operational coordination.
        - listitem [ref=f6e85]:
          - generic [ref=f6e87]:
            - paragraph [ref=f6e88]: 2016–23
            - heading "Institutional and telecom logistics" [level=3] [ref=f6e89]
          - paragraph [ref=f6e90]: The record documents continued cargo work and later telecommunications logistics, including antennas, site equipment, vehicles, personnel, and technical support.
        - listitem [ref=f6e92]:
