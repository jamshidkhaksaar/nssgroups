      - paragraph [ref=f6e40]: ABOUT NSS
      - heading "A documented logistics heritage, coordinated for what comes next." [level=1] [ref=f6e41]
      - paragraph [ref=f6e42]: NSS brings together freight-union roots dating to 2000, formally registered companies, and practical experience across transport, logistics, procurement, construction, and regional trade.
    - generic [ref=f6e44]:
      - generic [ref=f6e46]:
        - paragraph [ref=f6e47]: 2000–2026
        - heading "Built through service, formalized through experience." [level=2] [ref=f6e48]
        - paragraph [ref=f6e49]: The supplied corporate record traces NSS from organized freight and driver coordination to a six-company group and an international B2B platform under development.
        - link "View Full Company Portfolio" [ref=f6e50] [cursor=pointer]:
          - /url: /company-portfolio
