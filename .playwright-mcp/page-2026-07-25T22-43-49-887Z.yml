            - paragraph [ref=f6e95]: "2024"
            - heading "Regional trade and transit" [level=3] [ref=f6e96]
          - paragraph [ref=f6e97]: The group broadened sourcing and corridor coordination across Afghanistan, Central Asia, South Asia, Iran, the UAE, and wider regional markets.
        - listitem [ref=f6e99]:
