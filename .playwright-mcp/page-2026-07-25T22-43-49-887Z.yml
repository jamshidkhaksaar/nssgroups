            - heading "Coordinated NSS platform" [level=3] [ref=f6e103]
          - paragraph [ref=f6e104]: NSS is consolidating group capabilities and developing a multilingual B2B platform for marketplace discovery, RFQs, transport requests, documents, and shipment visibility.
