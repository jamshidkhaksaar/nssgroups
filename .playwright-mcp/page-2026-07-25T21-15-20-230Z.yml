  - main [ref=f1e65]:
    - generic [ref=f1e68]:
      - paragraph [ref=f1e69]: ABOUT NSS
      - heading "A transport heritage, coordinated for the region." [level=1] [ref=f1e70]
      - paragraph [ref=f1e71]: NSS International Group of Companies brings together a documented Afghan transport legacy with coordinated trade, transit, logistics and construction services.
    - generic [ref=f1e73]:
      - generic [ref=f1e75]:
        - paragraph [ref=f1e76]: OUR HISTORY
        - heading "From organised freight to a regional service model." [level=2] [ref=f1e77]
        - paragraph [ref=f1e78]: Our record begins with organised freight operations in 2000 and develops through formal forwarding, institutional logistics, specialist companies and regional service coordination.
      - generic [ref=f1e81]:
        - article [ref=f1e83]:
          - paragraph [ref=f1e85]: "2000"
          - heading "Freight and transport heritage" [level=3] [ref=f1e86]
          - paragraph [ref=f1e87]: Tamim Sahib Ansar Freight Union began organising carriers, drivers and domestic freight movements across Afghanistan.
        - article [ref=f1e89]:
          - paragraph [ref=f1e91]: "2010"
          - heading "Formal freight-forwarding company" [level=3] [ref=f1e92]
          - paragraph [ref=f1e93]: Nawi Samim Samir International Transit and Freight Forwarding Limited expanded the group’s domestic and international transport, transit, cargo-management and procurement work.
        - article [ref=f1e95]:
          - paragraph [ref=f1e97]: 2010–2020
          - heading "Documented institutional logistics" [level=3] [ref=f1e98]
          - paragraph [ref=f1e99]: The supplied record documents tenders, contracts and deliveries supporting humanitarian, food, agricultural, educational and project cargo movements.
        - article [ref=f1e101]:
          - paragraph [ref=f1e103]: 2013–2016
          - heading "Specialist companies added" [level=3] [ref=f1e104]
          - paragraph [ref=f1e105]: Construction, road-building and dedicated logistics services broadened the group’s operating structure.
        - article [ref=f1e107]:
          - paragraph [ref=f1e109]: "2024"
          - heading "Regional trade and transit expansion" [level=3] [ref=f1e110]
          - paragraph [ref=f1e111]: NSS expanded its regional operating focus across South Asia, Central Asia, Iran, the UAE and Russia through land and rail service coordination.
        - article [ref=f1e113]:
          - paragraph [ref=f1e115]: "2026"
          - heading "A coordinated NSS platform" [level=3] [ref=f1e116]
          - paragraph [ref=f1e117]: The group is developing a connected, request-and-quote digital service model for sourcing, transport visibility and document coordination.
    - generic [ref=f1e119]:
      - generic [ref=f1e120]:
        - paragraph [ref=f1e121]: GROUP STRUCTURE
        - heading "Specialist companies, coordinated as one group." [level=2] [ref=f1e122]
        - paragraph [ref=f1e123]: NSS is built on complementary transport, freight-forwarding, construction and logistics operations documented in the supplied company record.
