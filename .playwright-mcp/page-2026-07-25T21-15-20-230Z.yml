        - article [ref=f1e136]:
          - generic [ref=f1e137]: "02"
          - heading "Tamim Sahib Transport" [level=3] [ref=f1e143]
          - paragraph [ref=f1e144]: Domestic transport, institutional-contract support, relief and equipment movements, and vehicle-hire services.
        - article [ref=f1e146]:
