          - heading "Nawi Samim Samir International Transit and Freight Forwarding Limited" [level=3] [ref=f1e153]
          - paragraph [ref=f1e154]: Established in 2010 for transit, freight forwarding, logistics and domestic and international cargo movements.
        - article [ref=f1e156]:
