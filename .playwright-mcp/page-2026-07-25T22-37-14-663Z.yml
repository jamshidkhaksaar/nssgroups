    - generic [ref=e334]:
      - generic [ref=e335]:
        - paragraph [ref=e336]: HOW NSS WORKS
        - heading "An RFQ-led process with confirmation before commitment." [level=2] [ref=e337]
        - paragraph [ref=e338]: Submitting a request starts review; it does not reserve capacity, create an order, or guarantee a rate.
      - generic [ref=e339]:
        - article [ref=e341]:
          - generic [ref=e342]: "01"
          - heading "1. Requirement review" [level=3] [ref=e350]
          - paragraph [ref=e351]: NSS records the product, cargo, origin, destination, timing, specifications, and documents needed to understand the request.
        - article [ref=e353]:
          - generic [ref=e354]: "02"
          - heading "2. Clarification and compliance" [level=3] [ref=e360]
          - paragraph [ref=e361]: Staff identify missing information, regulated-goods requirements, destination restrictions, and required human approvals.
        - article [ref=e363]:
          - generic [ref=e364]: "03"
          - heading "3. Sourcing and planning" [level=3] [ref=e371]
          - paragraph [ref=e372]: Qualified suppliers, routes, modes, equipment, handlers, and operational assumptions are compared for the case.
        - article [ref=e374]:
          - generic [ref=e375]: "04"
          - heading "4. Versioned quotation" [level=3] [ref=e380]
          - paragraph [ref=e381]: NSS issues a time-limited quote showing scope, currency, Incoterms where relevant, assumptions, exclusions, and revisions.
        - article [ref=e383]:
          - generic [ref=e384]: "05"
          - heading "5. Capacity confirmation" [level=3] [ref=e393]
          - paragraph [ref=e394]: Only authorized staff confirm supplier, carrier, schedule, equipment, and capacity after quote acceptance and required approvals.
        - article [ref=e396]:
          - generic [ref=e397]: "06"
          - heading "6. Order and delivery record" [level=3] [ref=e403]
          - paragraph [ref=e404]: A confirmed case becomes an order and, when applicable, one or more shipment legs with events, documents, and delivery evidence.
      - paragraph [ref=e410]: NSS does not present inquiry forms as binding orders. There is no public online checkout, escrow, autonomous customs clearance, or guaranteed real-time tracking.
