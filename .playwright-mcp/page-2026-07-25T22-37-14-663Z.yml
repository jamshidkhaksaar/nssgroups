          - paragraph [ref=e112]: CORPORATE OVERVIEW
          - heading "From freight coordination to an integrated B2B group." [level=2] [ref=e113]
        - paragraph [ref=e114]: NSS Group of Companies traces its operating heritage to the Tamim Sahib Ansar Freight Union in 2000. The group developed through formal freight forwarding, specialist logistics, construction and road-building companies, and later regional trade and transit coordination.
        - paragraph [ref=e115]: Today, NSS is organizing that experience into a multilingual, RFQ-led platform for verified products, procurement requests, multimodal transport, shipment records, documents, and managed business relationships.
        - paragraph [ref=e117]: One accountable path from requirement review to confirmed sourcing, movement, and delivery.
      - figure "Operational imagery is used to illustrate the group’s cargo-coordination context; service scope is confirmed for each request." [ref=e119]:
        - img "Bagged cargo stored inside a logistics warehouse" [ref=e120]
